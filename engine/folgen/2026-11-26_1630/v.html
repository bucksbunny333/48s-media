 for(let i=0;i<=4;i++){const b=Math.PI*(1-i/4);s+=`<line x1="${cx+(r-40)*Math.cos(b)}" y1="${cy-(r-40)*Math.sin(b)}" x2="${cx+(r-62)*Math.cos(b)}" y2="${cy-(r-62)*Math.sin(b)}" stroke="#5c6575" stroke-width="6"/>`;}
 s+=`<line x1="${cx}" y1="${cy}" x2="${cx+(r-30)*Math.cos(a)}" y2="${cy-(r-30)*Math.sin(a)}" stroke="#fff" stroke-width="12" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="22" fill="#fff"/>`;
