<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#000;font-family:Inter;color:#fff;overflow:hidden;position:relative}
svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
#flash{position:absolute;inset:0;opacity:0}
</style></head><body>
<svg id="stage" viewBox="0 0 1080 1920"></svg><div id="flash"></div>
<script src="rig.js"></script><script src="poses.js"></script><script src="kit.js"></script><script src="h.js"></script><script src="timing.js"></script>
<script>
// „Lesen vs. Abfragen“ – Roediger & Karpicke (2006), Psychological Science 17(3), Experiment 2
window.DUR=60.0; const PAY=S[12]; const H=(location.hash||'#A').slice(1); const ENDC=58.0;
const LIQ='#4da3ff', PUR='#b48cff';
let JID=0;
function jar(cx,top,w,h,lv,col,label,pct,leak,t,o=1,lcol=WHITE){if(o<=0)return'';const id='j'+(JID++);const x=cx-w/2,b=top+h;const ly=b-h*0.92*cl(lv);
 let s=`<g opacity="${o}"><clipPath id="${id}"><rect x="${x+8}" y="${top+8}" width="${w-16}" height="${h-16}" rx="${w*0.16}"/></clipPath>`;
 s+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" rx="${w*0.18}" fill="#0b0f16" stroke="#cfd6e6" stroke-width="8"/>`;
 let wave=`M${x},${ly}`;for(let i=0;i<=12;i++){const xx=x+i*w/12;wave+=` L${xx.toFixed(1)},${(ly+6*Math.sin(t*5+i*0.9)).toFixed(1)}`;}wave+=` L${x+w},${b} L${x},${b} Z`;
 s+=`<g clip-path="url(#${id})"><path d="${wave}" fill="${col}" opacity=".85"/></g>`;
 s+=`<rect x="${x-14}" y="${top-34}" width="${w+28}" height="34" rx="10" fill="#2a3444"/>`;
 if(leak>0){for(let i=0;i<4;i++){const k=((t*1.6+i*0.25)%1);s+=`<path d="M${cx+w*0.2},${b+k*160} q-12,22 0,34 q12,-12 0,-34Z" fill="${col}" opacity="${leak*(1-k)}"/>`;}
  s+=`<path d="M${cx+w*0.12},${b-60} l18,30 l-14,18 l16,22" stroke="#fff" stroke-width="5" fill="none" opacity="${leak}"/>`;}
 if(pct!==null)s+=txt(cx,top+h*0.55,pct,Math.min(110,w*0.3),lcol,900);
 if(label)s+=txt(cx,top-56,label,40,'#cfd6e6',900,1,'middle',3);
 return s+'</g>';}
function book(x,y,sc,col,open=0){return `<g transform="translate(${x},${y}) scale(${sc})"><rect x="-60" y="-80" width="120" height="160" rx="10" fill="${col}"/><rect x="-48" y="-68" width="96" height="136" rx="6" fill="#0b0f16" opacity=".25"/><line x1="-30" y1="-30" x2="30" y2="-30" stroke="#fff" stroke-width="8" opacity=".6"/><line x1="-30" y1="0" x2="20" y2="0" stroke="#fff" stroke-width="8" opacity=".6"/></g>`}
function qcard(x,y,sc,col){return `<g transform="translate(${x},${y}) scale(${sc})"><rect x="-60" y="-80" width="120" height="160" rx="14" fill="#0b0f16" stroke="${col}" stroke-width="8"/>${txt(0,30,'?',100,col,900)}</g>`}
// Werte der beiden Gläser über die Zeit
function lv(t){let a=0.83,b=0.71;
 if(t<S[5]){a=0;b=0;}
 else if(t<S[8]){const k=eo(cl((t-S[5]-1.0)/1.4));a=0.83*k;b=0.71*k;}
 else{const k=eio(cl((t-S[8]-0.2)/1.6));a=0.83+(0.40-0.83)*k;b=0.71+(0.61-0.71)*k;}
 return [a,b];}
// Hook: Ben liest, Glas läuft aus
function hook(t){const o=env(t,-1,S[3]+0.2,0.001,0.3);if(o<=0)return'';let s=`<g opacity="${o}">`;
 let lvl,pct,leak=0,col=LIQ;
 if(t<S[1]){lvl=1-0.85*cl(t/2.6);leak=1;col=RED;pct=Math.round(lvl*100)+' %';}
 else if(t<S[2]){const n=Math.min(3,1+Math.floor((t-S[1])/1.2));lvl=0.3+0.7*eo(cl((t-S[1])/3.6));pct=Math.round(lvl*100)+' %';col=LIQ;}
 else{const k=eio(cl((t-S[2]-0.3)/1.8));lvl=1-0.52*k;pct=Math.round(lvl*100)+' %';leak=k>0&&k<1?1:0.4;col=k>0.5?RED:LIQ;}
 const sh=t<0.6?Math.sin(t*60)*8*(1-t/0.6):0;
 s+=`<g transform="translate(${sh},0)">`+jar(465,560,340,480,lvl,col,'DEIN GEDÄCHTNIS',pct,leak,t,1,WHITE)+'</g>';
 // Tageszähler
 if(t<S[1]){const d=Math.min(7,1+Math.floor(t/0.37));s+=`<g transform="translate(465,1095)">`+tag(0,0,'TAG '+d+' VON 7',RED,'#fff',40)+'</g>';}
 if(t>=S[2]){const d=Math.min(7,1+Math.floor((t-S[2]-0.3)/0.26));s+=`<g transform="translate(465,1095)">`+tag(0,0,'TAG '+Math.max(1,d)+' VON 7',RED,'#fff',40)+'</g>';}
 if(t>=S[1]&&t<S[2]){const n=Math.min(3,1+Math.floor((t-S[1])/1.2));s+=`<g transform="translate(465,1095)">`+tag(0,0,'GELESEN: '+n+'×',LIQ,'#05070c',40)+'</g>';
  if(t>S[1]+3.0){const q=cl((t-S[1]-3.0)/0.3);s+=`<g opacity="${q}" transform="translate(760,640) scale(${0.6+0.4*eb(q)})">`+tag(0,0,'✓ FÜHLT SICH GUT AN',GREEN,'#05070c',30)+'</g>';}}
 // Ben mit Buch
 const flip=Math.floor(t*6)%2;s+=benAt(260,1490,P.read,0.85,WHITE,0,1,true)+book(500,1320,1.1,t<S[1]||t>=S[2]?ORANGE:LIQ)+
  `<path d="M500,1232 L${500+(flip?60:-60)},1246 L500,1408Z" fill="#f4efe4" opacity=".9"/>`;
 return s+'</g>'+stampT(t,S[2]+2.0,S[3]+0.1,'MEHR ALS DIE HÄLFTE WEG',RED,465,1270,36,-5);}
// Studie: zwei Gläser
function study(t){const o=env(t,S[3],S[12]+0.05,0.3,0.25);if(o<=0)return'';let s=`<g opacity="${o}">`;
 const [a,b]=lv(t);const showA=t>=S[3],showB=t>=S[4]-0.1;
 const post=t>=S[8];const ca=post?RED:LIQ,cb=post?GREEN:PUR;
 const pa=t>=S[5]+1.0?Math.round(a*100)+' %':'',pb=t>=S[5]+1.0?Math.round(b*100)+' %':'';
 const wob=(t>=S[7]&&t<S[8]+0.2)?Math.sin(t*30)*5:0;
 s+=`<g transform="translate(${wob},0)">`+jar(290,640,300,440,a,ca,'LESER',pa||null,post&&t<S[8]+2?1:0,t,showA?1:0)+jar(690,640,300,440,b,cb,'ABFRAGER',pb||null,0,t,showB?1:0)+'</g>';
 // Methode unter den Gläsern (bis S5)
 const mo=env(t,S[3],S[5]+0.3,0.2,0.3);if(mo>0){s+=`<g opacity="${mo}">`;
  for(let i=0;i<4;i++){const q=cl((t-S[3]-1.4-i*0.35)/0.25);if(q>0)s+=book(170+i*80,1200,0.45*(0.6+0.4*eb(q)),LIQ);}
  if(t>=S[4]){s+=book(570,1200,0.45,PUR);for(let i=0;i<3;i++){const q=cl((t-S[4]-2.0-i*0.4)/0.25);if(q>0)s+=qcard(650+i*80,1200,0.45*(0.6+0.4*eb(q)),PUR);}}
  s+=txt(290,1300,'4× LESEN',36,LIQ,900)+(t>=S[4]?txt(680,1300,'1× LESEN + 3× ABFRAGEN',25,PUR,900):'')+'</g>';}
 // Uhr / Kalender-Tag
 if(t>=S[5]&&t<S[7]){const q=env(t,S[5],S[7],0.2,0.2);s+=`<g opacity="${q}" transform="translate(465,1210)">`+tag(0,0,'⏱ TEST NACH 5 MINUTEN',WHITE,'#111',38)+'</g>';}
 if(t>=S[7]){const d=Math.min(7,1+Math.floor((t-S[7]-0.2)/0.35));const q=env(t,S[7],S[12],0.2,0.2);s+=`<g opacity="${q}" transform="translate(465,1150)">`+tag(0,0,d<7?'TAG '+d+' …':'TEST NACH 1 WOCHE',d<7?ORANGE:WHITE,'#111',38)+'</g>';}
 // Krone
 if(t>=S[5]+2.4){const onB=t>=S[8]+1.6;const cx=onB?690:290;const q=cl((t-(onB?S[8]+1.6:S[5]+2.4))/0.3);s+=`<g opacity="${q}" transform="translate(${cx},${490-20*(1-eb(q))})"><path d="M-50,30 L-50,-20 L-25,5 L0,-30 L25,5 L50,-20 L50,30Z" fill="${YEL}"/></g>`;}
 // Vergessen
 if(t>=S[9]){const q=cl((t-S[9]-0.3)/0.3);s+=`<g opacity="${q}">`+`<g transform="translate(290,1300) scale(${0.6+0.4*eb(q)})">`+tag(0,0,'−52 % VERGESSEN',RED,'#fff',32)+'</g>';
  const q2=cl((t-S[9]-2.2)/0.3);s+=`<g opacity="${q2}" transform="translate(690,1300) scale(${0.6+0.4*eb(q2)})">`+tag(0,0,'−14 %',GREEN,'#05070c',32)+'</g></g>';}
 // Selbstvertrauen
 if(t>=S[10]&&t<S[12]){const q=env(t,S[10],S[11]+0.1,0.3,0.3);if(q>0){s+=`<g opacity="${q}"><rect x="110" y="1335" width="770" height="140" rx="24" fill="#0b0f16" stroke="#2a3444" stroke-width="5"/>`+txt(140,1378,'„ICH BEHALTE DAS“ (1–7)',26,'#cfd6e6',800,1,'start',2);
  const ka=eo(cl((t-S[10]-0.6)/1.0)),kb=eo(cl((t-S[10]-1.4)/1.0));
  s+=`<rect x="140" y="1400" width="${300*ka*4.8/7}" height="50" rx="10" fill="${LIQ}"/>`+txt(140+300*ka*4.8/7+12,1438,ka>0.9?'4,8':'',32,LIQ,900,1,'start');
  s+=`<rect x="510" y="1400" width="${300*kb*4.0/7}" height="50" rx="10" fill="${PUR}"/>`+txt(510+300*kb*4.0/7+12,1438,kb>0.9?'4,0':'',32,PUR,900,1,'start');
  s+='</g>';}}
 // Gefühl vs. Wirkung
 if(t>=S[11]){const q=cl((t-S[11]-0.2)/0.3),q2=cl((t-S[11]-2.0)/0.3),q3=cl((t-S[11]-3.6)/0.3);
  s+=`<g opacity="${q}" transform="translate(290,1380)">`+tag(0,0,'FÜHLT SICH GUT AN',GREEN,'#05070c',30)+'</g>';
  s+=`<g opacity="${q2}" transform="translate(690,1380)">`+tag(0,0,'FÜHLT SICH SCHWER AN',RED,'#fff',30)+'</g>';
  s+=`<g opacity="${q3}" transform="translate(690,1450) scale(${0.6+0.4*eb(q3)})">`+tag(0,0,'BLEIBT HÄNGEN ✓',GREEN,'#05070c',32)+'</g>';}
 return s+'</g>'+stampT(t,S[8]+1.6,S[9]+0.1,'UMGEDREHT',RED,465,1290,62,-6)+stampT(t,S[10]+2.4,S[11]+0.1,'FALSCHES GEFÜHL',RED,465,860,72,-8);}
// Ben in der Studienphase
function benStudy(t){let s='';if(t>=S[6]&&t<S[7]){const o=env(t,S[6],S[7],0.2,0.2);s+=`<g opacity="${o}">`+benAt(330,1480,FIG.mix(P.stand,P.cheer,0.35+0.15*Math.sin(t*8)),0.6,WHITE,0,1,true)+'</g>';
  s+=`<g opacity="${o}" transform="translate(610,1330)">`+tag(0,0,'„LESEN KLAPPT DOCH!“',LIQ,'#05070c',30)+'</g>';}
 return s;}
// Payoff
function payoff(t){if(t<PAY)return'';let s='';const o=env(t,PAY,ENDC+0.3,0.001,0.3);s+=`<g opacity="${o}">`;
 const shut=eio(cl((t-PAY)/0.25));s+=`<g transform="translate(465,680) scale(${1.6-0.3*eb(cl((t-PAY)/0.4))})"><rect x="-150" y="-110" width="300" height="220" rx="16" fill="${ORANGE}"/>${txt(0,25,'ZU.',90,'#111',900)}</g>`;
 const steps=[['1','BUCH ZU',0.2],['2','AUFSCHREIBEN, WAS DU WEISST',1.1],['3','DANN NACHSCHAUEN',2.6]];
 steps.forEach(([n,w,dt],i)=>{const q=cl((t-PAY-dt)/0.3);if(q<=0)return;const y=920+i*120;s+=`<g opacity="${q}" transform="translate(${40*(1-eb(q))},0)"><circle cx="120" cy="${y}" r="42" fill="${GREEN}"/>${txt(120,y+16,n,48,'#05070c',900)}${txt(180,y+15,w,40,WHITE,900,1,'start')}</g>`;});
 if(t>=S[13]){const k=cl((t-S[13]-0.2)/1.4);s+=`<g transform="translate(330,1330)"><circle r="70" fill="#0b0f16" stroke="#2a3444" stroke-width="12"/><path d="M0,-70 A70,70 0 ${k>0.5?1:0} 1 ${70*Math.sin(k*2*Math.PI)},${-70*Math.cos(k*2*Math.PI)}" fill="none" stroke="${GREEN}" stroke-width="12" stroke-linecap="round"/>${txt(0,14,'10',44,WHITE,900)}</g>`+txt(430,1345,'MINUTEN.',48,GREEN,900,1,'start');}
 s+=benAt(760,1500,t>=S[13]?P.cheer:P.read,0.75,WHITE,0,1,false);
 return s+'</g>';}
function endCard(t){if(t<ENDC)return'';const o=cl((t-ENDC)/0.25);const sc=0.9+0.1*eb((t-ENDC)/0.4);
 return `<g opacity="${o}"><rect width="1080" height="1920" fill="#05070c" opacity=".93"/>`+txt(540,300,'NÄCHSTES VIDEO · 16:30',64,YEL,900,1,'middle',2)+
 txt(540,560,'WIE VIEL VON',84,WHITE,900)+txt(540,660,'DEINEM TAG LÄUFT',84,WHITE,900)+txt(540,760,'AUF AUTOPILOT?',84,ORANGE,900)+
 `<g transform="translate(465,1100) scale(${sc})">`+pill(0,0,'FOLG BEN →',GREEN,'#05070c',70)+'</g>'+benAt(465,1460,P.cheer,0.7,WHITE,0,1,true)+'</g>';}
window.SFXC=()=>{const c=[[0,'whoosh'],[0.05,'boom']];for(let k=0;k<7;k++)c.push([k*0.37+0.05,'tick']);c.push([0.3,'buzz']);
 for(let k=0;k<3;k++)c.push([S[1]+k*1.2,'pop']);c.push([S[1]+3.0,'ding']);
 c.push([S[2],'whoosh']);for(let k=0;k<7;k++)c.push([S[2]+0.3+k*0.26,'tick']);c.push([S[2]+2.0,'boom'],[S[2]+2.05,'buzz']);
 c.push([S[3],'whoosh']);for(let k=0;k<4;k++)c.push([S[3]+1.4+k*0.35,'pop']);c.push([S[4],'whoosh']);c.push([S[4]+0.1,'pop']);for(let k=0;k<3;k++)c.push([S[4]+2.0+k*0.4,'pop']);
 c.push([S[5],'whoosh']);for(let k=0;k<6;k++)c.push([S[5]+1.0+k*0.22,'tick']);c.push([S[5]+2.4,'ding']);
 c.push([S[6],'pop'],[S[7],'whoosh']);for(let k=0;k<7;k++)c.push([S[7]+0.2+k*0.35,'tick']);
 c.push([S[8],'whoosh']);for(let k=0;k<7;k++)c.push([S[8]+0.2+k*0.22,'tick']);c.push([S[8]+1.6,'boom'],[S[8]+1.7,'ding']);
 c.push([S[9]+0.3,'buzz'],[S[9]+2.2,'ding'],[S[10],'whoosh'],[S[10]+0.6,'pop'],[S[10]+1.4,'pop'],[S[10]+2.4,'boom']);
 c.push([S[11],'whoosh'],[S[11]+0.2,'pop'],[S[11]+2.0,'buzz'],[S[11]+3.6,'ding']);
 c.push([PAY-0.4,'whoosh'],[PAY,'boom'],[PAY+0.05,'ding'],[PAY+1.1,'pop'],[PAY+2.6,'pop'],[S[13],'tick'],[S[13]+1.6,'ding'],[S[14],'whoosh'],[S[14]+1.0,'pop'],[ENDC,'whoosh'],[ENDC+0.3,'ding']);return c;};
window.render=function(t){JID=0;let s='';
 const shake=Math.max(env(t,-0.1,0.7,0.001,0.6),env(t,PAY,PAY+0.6,0.001,0.5),env(t,S[2]+2.0,S[2]+2.4,0.001,0.3)*0.6,env(t,S[8]+1.6,S[8]+2.0,0.001,0.3)*0.6,env(t,S[10]+2.4,S[10]+2.8,0.001,0.3)*0.5);
 const jx=Math.sin(t*91)*18*shake,jy=Math.cos(t*67)*14*shake;
 const red=Math.max(env(t,-1,1.5,0.1,0.8)*0.6,env(t,S[2]+1.5,S[3],0.2,0.3)*0.5,env(t,S[8]+1.6,S[9]+1,0.05,0.4)*0.45,env(t,S[10]+2.4,S[11],0.05,0.3)*0.4);
 const green=env(t,PAY,PAY+2.6,0.05,1.2);
 s+=bg(red,green);
 s+=`<g transform="translate(${jx},${jy})">`;
 const z=H==='C'&&t<0.9?1.8-0.8*eio(t/0.9):(t<0.5?1.1-0.1*eio(t/0.5):1);
 s+=`<g transform="translate(465,800) scale(${z}) translate(-465,-800)">`+hook(t)+'</g>';
 s+=study(t)+benStudy(t)+payoff(t);
 if(H==='B'&&t<1.2){for(let i=0;i<9;i++){const x=120+((i*157)%820),y=-200+((t*1400+i*230)%1500);s+=book(x,y,0.6,i%2?ORANGE:LIQ);}}
 s+='</g>';
 s+=head();
 s+=LH(t,-1,S[1],300,'WARUM IST NACH 1 WOCHE',70,WHITE)+LH(t,-1,S[1],378,'FAST ALLES WEG, WAS DU GELERNT HAST?',44,YEL);
 s+=L(t,S[1],S[2],300,'DU LIEST DEN STOFF.',80,WHITE)+L(t,S[1]+1.2,S[2],378,'NOCHMAL. UND NOCHMAL.',58,LIQ);
 s+=L(t,S[2],S[3],300,'NACH EINER WOCHE:',90,WHITE)+L(t,S[2]+1.2,S[3],378,'MEHR ALS DIE HÄLFTE WEG.',58,RED);
 s+=L(t,S[3],S[4],300,'DAS EXPERIMENT:',96,WHITE)+L(t,S[3]+1.4,S[4],378,'GRUPPE 1 LIEST 4×',62,LIQ);
 s+=L(t,S[4],S[5],300,'GRUPPE 2 LIEST 1×',84,WHITE)+L(t,S[4]+1.8,S[5],378,'UND FRAGT SICH 3× SELBST AB',52,PUR);
 s+=L(t,S[5],S[6],300,'TEST NACH 5 MINUTEN:',76,WHITE)+L(t,S[5]+1.4,S[6],378,'LESER GEWINNEN. 83 : 71',58,LIQ);
 s+=L(t,S[6],S[7],300,'DESHALB GLAUBST DU:',84,WHITE)+L(t,S[6]+0.6,S[7],378,'„LESEN FUNKTIONIERT.“',60,LIQ);
 s+=L(t,S[7],S[8],300,'UND JETZT:',100,WHITE)+L(t,S[7]+0.5,S[8],378,'TEST NACH EINER WOCHE …',58,ORANGE);
 s+=L(t,S[8],S[9],300,'LESER: 40 %',96,RED)+L(t,S[8]+1.4,S[9],378,'ABFRAGER: 61 %',70,GREEN);
 s+=L(t,S[9],S[10],300,'LESER: ÜBER DIE HÄLFTE WEG.',64,RED)+L(t,S[9]+2.2,S[10],378,'ABFRAGER: NUR EIN SIEBTEL.',56,GREEN);
 s+=L(t,S[10],S[11],300,'DAS VERRÜCKTE:',96,WHITE)+L(t,S[10]+1.0,S[11],378,'DIE LESER WAREN SICH SICHERER.',50,YEL);
 s+=L(t,S[11],PAY,300,'ABFRAGEN FÜHLT SICH',80,WHITE)+L(t,S[11]+2.0,PAY,378,'AN WIE SCHEITERN. UND BLEIBT.',52,GREEN);
 if(t>=PAY){const o=env(t,PAY,S[13],0.001,0.25),sc=1.5-0.5*eb((t-PAY)/0.35);s+=`<g opacity="${o}" transform="translate(540,300) scale(${sc})">${txt(0,0,'KLAPP DAS BUCH ZU.',72,GREEN,900,1,'middle',1)}</g>`+L(t,PAY+1.1,S[13],378,'SCHREIB AUF, WAS DU NOCH WEISST.',50,WHITE);}
 s+=L(t,S[13],S[14],300,'10 MINUTEN.',110,GREEN)+L(t,S[13]+0.8,S[14],378,'MEHR NICHT.',66,WHITE);
 s+=L(t,S[14],ENDC+0.2,300,'SCHICK DAS JEMANDEM,',80,WHITE)+L(t,S[14]+0.5,ENDC+0.2,378,'DER GERADE FÜR EINE PRÜFUNG LERNT.',46,YEL);
 if(t>S[14]+0.6&&t<ENDC){const o=env(t,S[14]+0.6,ENDC,0.25,0.2),sc=0.85+0.15*eb((t-S[14]-0.6)/0.4);s+=pill(465,1440,'SCHREIB 48, WENN DU ES HEUTE TESTEST.',WHITE,'#000',28,o,sc);}
 if(t>=S[3]&&t<S[5]+0.3)s+=cpill(t,S[3]+0.6,S[5]+0.3,'UND DU? LESEN ODER ABFRAGEN? SCHREIB’S IN DIE KOMMENTARE');
 s+=SRC(t,S[3],PAY,'Roediger & Karpicke (2006), Psychological Science 17(3), Exp. 2, N = 180','Erinnert nach 5 Min.: 83 vs. 71 % · nach 1 Woche: 40 vs. 61 %');
 s+=endCard(t);
 s+=brand();
 document.getElementById('stage').innerHTML=s;
 const fl=document.getElementById('flash');const w=env(t,-0.1,0.3,0.001,0.25),g=env(t,PAY,PAY+0.7,0.001,0.6),r=env(t,S[8]+1.6,S[8]+2.0,0.001,0.3);
 fl.style.background=g>0?GREEN:RED;fl.style.opacity=Math.max(0.22*w,0.38*g,0.3*r);
};
render(0);
</script></body></html>
