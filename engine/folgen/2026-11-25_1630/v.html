function priceTag(t,cx,cy,rot,sc,inner,col='#f4efe4',edge=RED){

 const ao=env(t,S[10]+0.3,S[11]+0.2,0.3,0.3);if(ao>0){const k=23.38*eo(cl((t-S[10]-0.6)/3.2));let g='';
