<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#000;font-family:Inter;color:#fff;overflow:hidden;position:relative}
svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
#flash{position:absolute;inset:0;opacity:0}
</style></head><body>
<svg id="stage" viewBox="0 0 1080 1920"></svg><div id="flash"></div>
<script src="rig.js"></script><script src="poses.js"></script><script src="kit.js"></script><script src="h.js"></script><script src="k27.js"></script><script src="timing.js"></script>
<script>
// „Wie lange wirklich?“ – Buehler, Griffin & Ross (1994), JPSP 67(3), 366–381 (Planungsfehlschluss)
window.DUR=61.0; const PAY=S[11]; const SAVE=58.6; const HV=(location.hash||'#A').slice(1);
const NAVY='#0a2a6b', BOARD='#0d1f4a';
const OPT=[['34','TAGE'],['45','TAGE'],['56','TAGE']];
const GY=1010;
// Tageszähler: 0→34 (S6..S7), 34→48 (S7+1.6..S8+0.4), 48→55,5 (S9-1.4..S9+0.4)
function day(t){if(t<S[6]+0.2)return 0;if(t<S[7]-0.1)return 34*eio(cl((t-S[6]-0.2)/(S[7]-S[6]-0.3)));if(t<S[8]-0.4)return 34;if(t<S[8]+0.4)return 34+14*eio(cl((t-S[8]+0.4)/0.8));if(t<S[9]-1.4)return 48;return 48+7.5*eio(cl((t-S[9]+1.4)/1.8));}
// Fertige von 37 (Studie 1): Tag 34 → 11 (29,7 %), Tag 48 → 18 (48,7 %), danach mehr
function done(d){if(d<=34)return Math.round(11*d/34);if(d<=48)return Math.round(11+7*(d-34)/14);return Math.min(37,Math.round(18+8*(d-48)/7.5));}
function flap(x,y,w,h,s,col,since,t,size){const k=cl((t-since)/0.35);const sy=k<1?Math.abs(Math.cos(k*Math.PI)):1;
 return `<g transform="translate(${x},${y})"><rect x="0" y="0" width="${w}" height="${h}" rx="8" fill="#05132e"/><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#000" stroke-width="3"/><g transform="translate(${w/2},${h/2}) scale(1,${sy}) translate(${-w/2},${-h/2})">${txt(w/2,h/2+size*0.36,s,size,col,900)}</g></g>`;}
function clock(x,y,r,t,spin){const a=spin*360;let s=`<g transform="translate(${x},${y})"><circle r="${r}" fill="${WHITE}" stroke="#2a3444" stroke-width="8"/>`;for(let i=0;i<12;i++){const q=i*30*Math.PI/180;s+=`<line x1="${Math.sin(q)*r*0.78}" y1="${-Math.cos(q)*r*0.78}" x2="${Math.sin(q)*r*0.92}" y2="${-Math.cos(q)*r*0.92}" stroke="#05070c" stroke-width="6"/>`;}
 s+=`<line x1="0" y1="0" x2="${Math.sin(a/12*Math.PI/180)*r*0.5}" y2="${-Math.cos(a/12*Math.PI/180)*r*0.5}" stroke="#05070c" stroke-width="9" stroke-linecap="round"/><line x1="0" y1="0" x2="${Math.sin(a*Math.PI/180)*r*0.75}" y2="${-Math.cos(a*Math.PI/180)*r*0.75}" stroke="#05070c" stroke-width="6" stroke-linecap="round"/><circle r="9" fill="${RED}"/></g>`;return s;}
function suitcase(x,y,sc,lab,col=ORANGE){return `<g transform="translate(${x},${y}) scale(${sc})"><rect x="-60" y="-80" width="120" height="90" rx="12" fill="${col}"/><rect x="-22" y="-98" width="44" height="22" rx="6" fill="none" stroke="${col}" stroke-width="7"/>${txt(0,-26,lab,18,'#05070c',900)}</g>`}
// ---------- Anzeigetafel (durchgehend bis PAY+)
function board(t){let s='';
 s+=`<rect x="60" y="440" width="960" height="340" rx="18" fill="${BOARD}" stroke="#2a4a8a" stroke-width="6"/>`;
 const proj=t<S[3]?'ABFAHRT: DEIN PROJEKT':'ABFAHRT: ABSCHLUSSARBEIT';
 s+=flap(90,462,900,72,proj,WHITE,t<S[3]?-9:S[3],t,40);
 s+=txt(100,580,'PLAN',30,'#9fb6e8',900,1,'start',3)+txt(560,580,'IST',30,'#9fb6e8',900,1,'start',3);
 s+=flap(90,594,420,108,'34 TAGE',WHITE,t<S[4]?-9:S[4],t,64);
 const d=day(t);let ist='?? TAGE',ic=YEL,since=-9;
 if(t>=S[6]+0.2){ist='TAG '+fmt(d,t>S[9]&&d%1?1:0);ic=d>34?RED:WHITE;}
 if(t>=S[9]+0.4&&t<PAY){ist='55,5 TAGE';ic=RED;since=S[9]+0.4;}
 if(t>=PAY){ist='PÜNKTLICH ✓';ic=GREEN;since=PAY;}
 const pulse=t<S[6]?1+0.04*Math.sin(t*5):1;
 s+=`<g transform="translate(770,648) scale(${pulse}) translate(-770,-648)">`+flap(550,594,440,108,ist,ic,since,t,ist.length>9?50:64)+'</g>';
 if(t>=S[5])s+=flap(90,716,420,52,'WORST CASE: 48 TAGE',ORANGE,S[5],t,30);
 // Laufschrift
 let info='';if(t<S[2])info='+++ BITTE MERK DIR DEINEN TIPP +++';else if(t<S[3])info='+++ 2 VON 3 PROJEKTEN VERSPÄTET +++';else if(t<S[6])info='+++ STUDIE: UNIVERSITY OF WATERLOO, KANADA +++';else if(t<S[9]+0.4)info='+++ VERSPÄTUNG WIRD ERMITTELT +++';else if(t<PAY)info='+++ VERSPÄTUNG: +22 TAGE +++';else info='+++ PUFFER EINGEPLANT +++';
 const sx=((t*110)%1400);s+=`<clipPath id="ck"><rect x="550" y="716" width="440" height="52"/></clipPath><g clip-path="url(#ck)">${txt(1000-sx,754,info,30,info.includes('+22')?RED:YEL,900,1,'start',2)}${txt(2400-sx,754,info,30,info.includes('+22')?RED:YEL,900,1,'start',2)}</g>`;
 // Bahnsteig + Ben + Uhr
 s+=`<rect x="0" y="${GY}" width="1080" height="16" fill="#2a3444"/><rect x="0" y="${GY+16}" width="1080" height="10" fill="${WHITE}" opacity=".5"/>`;
 const spin=t<S[6]?t*0.05:(t<PAY?t*0.05+day(t)/4:t*0.05+55.5/4);
 s+=clock(890,905,62,t,spin);
 const bp=t<S[6]?(Math.floor(t/0.8)%2?P.stand:Object.assign({},P.stand,{headTilt:12})):(t<PAY?Object.assign({},P.stand,{headTilt:-20,torso:-4}):P.cheer);
 if(t<PAY+1.4)s+=benAt(200,GY,bp,0.5,WHITE,0,1,true)+suitcase(290,GY,0.8,'PROJEKT');
 return s;}
// ---------- Hook-Optionen (bis S3)
function partHook(t){const o=env(t,-1,S[3]+0.1,0.001,0.3);if(o<=0)return'';let s='';
 s+=optCards(t,OPT,1180,1,{hl:Math.floor(t/0.9)%3});
 if(t>=S[1]+1.4&&t<S[2]){s+=`<g opacity="${cl((t-S[1]-1.4)/0.3)}" transform="translate(465,1360)">`+tag(0,0,'MERK DIR DEINEN TIPP',WHITE,'#05070c',38)+'</g>';}
 if(t>=S[2]){// 3 Koffer, 2 rot „SPÄTER“
  for(let i=0;i<3;i++){const q=eb(cl((t-S[2]-0.3-i*0.35)/0.35));const late=i<2;s+=`<g opacity="${cl(q)}">`+suitcase(245+i*220,1400,1.1*q,'PROJEKT',late?RED:GREEN)+txt(245+i*220,1445,late?'SPÄTER':'PÜNKTLICH',28,late?RED:GREEN,900)+'</g>';}}
 return `<g opacity="${o}">${s}</g>`;}
// ---------- Studierende (S3..PAY): 37 Köpfe
function grad(x,y,col,o=1){return `<g opacity="${o}" transform="translate(${x},${y})"><circle cx="0" cy="0" r="20" fill="#05070c" stroke="${col}" stroke-width="6"/><path d="M-24,-20 L0,-32 L24,-20 L0,-10Z" fill="${col}"/></g>`}
function partStudents(t){const o=env(t,S[3],S[10]+0.1,0.3,0.3);if(o<=0)return'';let s='';
 const d=day(t),n=t>=S[6]+0.2?done(d):0;
 for(let i=0;i<37;i++){const c=i%13,r=Math.floor(i/13);const q=cl((t-S[3]-0.2-i*0.04)/0.25);const fin=i<n;s+=grad(110+c*58,1150+r*72,fin?GREEN:'#5c6b85',q);}
 s+=txt(85,1095,'37 STUDIERENDE',30,'#cfd6e6',900,cl((t-S[3]-0.5)/0.3),'start');
 if(t>=S[6]+0.2)s+=txt(845,1095,'FERTIG: '+n+' / 37',34,n>0?GREEN:WHITE,900,1,'end');
 // Markierungen
 if(t>=S[7]&&t<S[9]){const pct=t<S[8]?'29,7 % FERTIG':'48,7 % FERTIG';s+=`<g transform="translate(465,1410) scale(${eb(cl((t-(t<S[8]?S[7]:S[8])-0.4)/0.35))})">`+tag(0,0,pct,t<S[8]?RED:ORANGE,WHITE,44)+'</g>';}
 if(t>=S[9]-1.4&&t<S[9]+0.4){s+=txt(465,1410,'…',80,YEL,900,0.5+0.5*Math.sin(t*12));}
 if(t>=S[9]+0.4&&t<S[10]){s+='<g transform="translate(465,1392) scale(.85) translate(-465,-1392)">'+optCards(t,OPT,1392,cl((t-S[9]-0.6)/0.3),{win:2})+'</g>';}
 return `<g opacity="${o}">${s}</g>`;}
// ---------- Bester Tag vs. echter Tag (S10..PAY)
function partReal(t){const o=env(t,S[10],PAY+0.1,0.25,0.25);if(o<=0)return'';let s=`<rect x="40" y="1050" width="860" height="420" fill="#05070c" opacity=".93"/>`;
 s+=`<rect x="70" y="1060" width="380" height="400" rx="24" fill="#0f2a17" stroke="${GREEN}" stroke-width="6"/>`+txt(260,1115,'DEIN PLAN',38,GREEN,900)+benAt(260,1400,P.cheer,0.5,WHITE,0,1,true)+txt(260,1440,'JEDER TAG PERFEKT',26,'#cfd6e6',900);
 s+=`<rect x="490" y="1060" width="380" height="400" rx="24" fill="#2a0f12" stroke="${RED}" stroke-width="6"/>`+txt(680,1115,'ECHTES LEBEN',38,RED,900)+benAt(680,1440,Object.assign({},P.stand,{headTilt:-30,torso:-8}),0.55,WHITE,0,1,true);
 const ev=['KRANK','NEBENJOB','GEBURTSTAG','KEIN BOCK'];ev.forEach((w,i)=>{const q=eb(cl((t-S[10]-1.0-i*0.45)/0.3));if(q>0)s+=`<g transform="translate(${590+(i%2)*170},${1170+i*58}) scale(${q}) rotate(${i%2?6:-6})">`+tag(0,0,w,RED,WHITE,28)+'</g>';});
 s+=txt(465,1490,'Beispiele',22,'#8a93a3',700,cl((t-S[10]-1)/0.3));
 return `<g opacity="${o}">${s}</g>`;}
// ---------- Kipppunkt (PAY..SAVE)
function payoff(t){const o=env(t,PAY,SAVE,0.001,0.25);if(o<=0)return'';let s='';
 if(t>=PAY+1.4){const u=cl((t-PAY-1.4)/1.6);s+=benAt(200+260*eo(u),GY,u<1?(Math.floor(t*3.3)%2?P.walkA:P.walkB):P.cheer,0.5,WHITE,0,1,true)+suitcase(290+260*eo(u),GY,0.8,'PROJEKT',GREEN);}
 if(t<S[12])s+=`<g transform="translate(465,1200) scale(${eb(cl((t-PAY-0.5)/0.4))})">`+tag(0,0,'+ PUFFER = PÜNKTLICH',GREEN,'#05070c',48)+'</g>';
 if(t>=S[12]&&t<S[13]){const q1=eb(cl((t-S[12])/0.35)),q2=eb(cl((t-S[12]-2.0)/0.35)),q3=eb(cl((t-S[12]-4.3)/0.35));
  s+=`<g transform="translate(465,1115) scale(${q1})"><rect x="-400" y="-60" width="800" height="110" rx="22" fill="#2a0f12" stroke="${RED}" stroke-width="5"/>${txt(0,12,'„WIE LANGE BRAUCHE ICH?“',38,WHITE,900)}</g>`+(t>S[12]+1.2?xmark(830,1110,32,1):'');
  s+=`<g transform="translate(465,1265) scale(${q2})"><rect x="-400" y="-60" width="800" height="110" rx="22" fill="#0f2a17" stroke="${GREEN}" stroke-width="5"/>${txt(0,12,'„WIE LANGE HAT’S LETZTES MAL GEDAUERT?“',29,WHITE,900)}</g>`;
  s+=`<g transform="translate(465,1415) scale(${q3})">`+tag(0,0,'UND: HEUTE ANFANGEN',YEL,'#05070c',46)+'</g>';}
 if(t>=S[13]){s+=optCards(t,OPT,1180,cl((t-S[13])/0.3),{win:2});const q=cl((t-S[13]-2.4)/0.3);s+=`<g opacity="${q}" transform="translate(465,1400)">`+tag(0,0,'SCHICK DAS AN DEN „MACH ICH NOCH“-FREUND',WHITE,'#05070c',28)+'</g>';}
 return `<g opacity="${o}">${s}</g>`;}
window.SFXC=()=>{const c=[[0,'whoosh'],[0.05,'boom'],[0.1,'pop']];for(let k=1;k<4;k++)c.push([k*0.9,'tick']);
 c.push([S[1],'whoosh'],[S[1]+1.4,'ding'],[S[2],'whoosh'],[S[2]+0.3,'buzz'],[S[2]+0.65,'buzz'],[S[2]+1.0,'pop']);
 c.push([S[3],'whoosh'],[S[3]+0.1,'tick'],[S[3]+0.3,'tick'],[S[3]+0.5,'tick'],[S[4],'whoosh'],[S[4]+0.1,'tick'],[S[4]+0.3,'pop'],[S[5],'whoosh'],[S[5]+0.1,'buzz']);
 for(let k=0;k<17;k++)c.push([S[6]+0.2+k*((S[7]-S[6]-0.3)/17),'tick']);
 c.push([S[7],'boom'],[S[7]+0.4,'pop']);for(let k=0;k<6;k++)c.push([S[8]-0.4+k*0.14,'tick']);c.push([S[8]+0.4,'buzz'],[S[8]+0.6,'pop']);
 for(let k=0;k<12;k++)c.push([S[9]-1.4+k*0.15,'tick']);c.push([S[9]+0.4,'boom'],[S[9]+0.7,'ding']);
 c.push([S[10],'whoosh']);for(let i=0;i<4;i++)c.push([S[10]+1.0+i*0.45,'buzz']);
 c.push([PAY,'boom'],[PAY+0.05,'ding'],[PAY+0.5,'pop'],[PAY+1.4,'whoosh']);
 c.push([S[12],'whoosh'],[S[12]+1.2,'buzz'],[S[12]+2.0,'ding'],[S[12]+4.3,'pop']);
 c.push([S[13],'whoosh'],[S[13]+0.3,'pop'],[S[13]+2.4,'pop'],[SAVE,'whoosh'],[SAVE+0.2,'pop'],[SAVE+0.42,'pop'],[SAVE+0.64,'pop'],[SAVE+0.8,'ding']);
 return c;};
window.render=function(t){let s=bg(t<0.6?0.5*(1-t/0.6)+0.15:(t>S[9]&&t<S[10]?0.35:0),t>=PAY&&t<SAVE?0.6:0);
 s+=head();
 s+=board(t);
 if(HV==='B'&&t<S[1])s+=`<rect x="60" y="440" width="960" height="500" fill="#05070c" opacity=".85"/>`+clock(540,690,210,t,t*1.5);
 if(HV==='C'&&t<S[1]){const n=34+Math.floor(t*14)%25;s+=`<rect x="60" y="440" width="960" height="340" fill="${BOARD}"/>`+flap(240,470,600,280,n+' TAGE',n>34?RED:WHITE,Math.floor(t*14)/14,t,150);}
 s+=partHook(t)+partStudents(t)+partReal(t)+payoff(t);
 s+=LH(t,-1,S[1],300,'GEPLANT: 34 TAGE.',80,WHITE)+LH(t,-1,S[2],378,'WIE LANGE WIRKLICH?',62,YEL);
 s+=L(t,S[1],S[2],300,'34, 45 ODER 56 TAGE?',76,WHITE);
 s+=L(t,S[2],S[3],300,'2 VON 3 PROJEKTEN',80,WHITE)+L(t,S[2]+0.3,S[3],378,'WERDEN SPÄTER FERTIG.',58,RED);
 s+=L(t,S[3],S[4],300,'DAS EXPERIMENT:',86,WHITE)+L(t,S[3]+0.6,S[4],378,'STUDIS VOR DER ABSCHLUSSARBEIT',48,YEL);
 s+=L(t,S[4],S[5],300,'IHR BESTER TIPP:',86,WHITE)+L(t,S[4]+1.0,S[5],378,'IM SCHNITT 34 TAGE.',58,YEL);
 s+=L(t,S[5],S[6],300,'UND WENN ALLES SCHIEFGEHT?',62,WHITE)+L(t,S[5]+1.2,S[6],378,'48 TAGE.',62,ORANGE);
 s+=L(t,S[6],S[7],300,'DANN LIEF DIE UHR.',84,WHITE);
 s+=L(t,S[7],S[8],300,'TAG 34:',96,WHITE)+L(t,S[7]+0.5,S[8],378,'NUR 3 VON 10 FERTIG.',58,RED);
 s+=L(t,S[8],S[9],300,'TAG 48 – WORST CASE:',74,WHITE)+L(t,S[8]+0.6,S[9],378,'NICHT MAL DIE HÄLFTE.',58,ORANGE);
 s+=L(t,S[9],S[10],300,'IM SCHNITT: 55 TAGE.',80,RED)+L(t,S[9]+1.6,S[10],378,'LÄNGER ALS IHR WORST CASE.',52,WHITE);
 s+=L(t,S[10],PAY,300,'WIR PLANEN MIT DEM BESTEN TAG.',58,WHITE)+L(t,S[10]+1.4,PAY,378,'NICHT MIT DEM ECHTEN.',58,RED);
 if(t>=PAY&&t<S[12]){const o=env(t,PAY,S[12],0.001,0.25),sc=1.5-0.5*eb((t-PAY)/0.35);s+=`<g opacity="${o}" transform="translate(540,300) scale(${sc})">${txt(0,0,'DIE GUTE NACHRICHT:',76,GREEN,900,1,'middle',1)}</g>`+L(t,PAY+0.9,S[12],378,'DAS KANNST DU AUSTRICKSEN.',54,WHITE);}
 s+=L(t,S[12],S[13],300,'DER TRICK:',96,GREEN)+L(t,S[12]+0.4,S[13],378,'PLANE MIT DEINEM LETZTEN MAL.',50,WHITE);
 s+=L(t,S[13],SAVE,300,'WAS HATTEST DU GETIPPT?',68,WHITE)+L(t,S[13]+0.5,SAVE,378,'SCHREIB’S IN DIE KOMMENTARE.',50,YEL);
 s+=cpill(t,20.6,25.4,'WELCHES PROJEKT SCHIEBST DU GERADE?');
 if(t<S[3])s+=SRC(t,S[2],S[3],'Buehler, Griffin & Ross (1994), J. Pers. Soc. Psychol. 67(3), 366–381','Umfrage: Ø 68 % früherer Projekte später fertig als erwartet');
 else s+=SRC(t,S[3],PAY,'Buehler, Griffin & Ross (1994), J. Pers. Soc. Psychol. 67(3), 366–381','Studie 1: N = 37 · Tipp 33,9 · Worst Case 48,6 · echt 55,5 Tage');
 s+=saveCard(t,SAVE,'PLANE WIE EIN PROFI:',['WIE LANG LETZTES MAL?','PUFFER DRAUF','HEUTE ANFANGEN']);
 s+=brand();
 document.getElementById('stage').innerHTML=s;
 const fl=document.getElementById('flash');const g=env(t,PAY,PAY+0.7,0.001,0.6);
 fl.style.background=GREEN;fl.style.opacity=0.38*g;
};
render(0);
</script></body></html>
