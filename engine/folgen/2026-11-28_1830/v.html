<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#000;font-family:Inter;color:#fff;overflow:hidden;position:relative}
svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
#flash{position:absolute;inset:0;opacity:0}
</style></head><body>
<svg id="stage" viewBox="0 0 1080 1920"></svg><div id="flash"></div>
<script src="rig.js"></script><script src="poses.js"></script><script src="kit.js"></script><script src="h.js"></script><script src="k27.js"></script><script src="timing.js"></script>
<script>
// „Wie viele Fremde musst du fragen?“ – Flynn & Lake (2008), JPSP 95(1), 128–143
window.DUR=61.0; const PAY=S[11]; const SAVE=58.45; const HV=(location.hash||'#A').slice(1);
const OPT=[['5','LEUTE'],['10','LEUTE'],['20','LEUTE']];
const GREYS=['#8a93a3','#6f7d95','#9aa6b8','#7b8aa3'];
const GY=960; const BS=0.95, WS=0.8; // Boden der Straße
const ASK=['N','J','N','J','J','N','N','J','N','J']; // 10 Gefragte, 5 Ja (Studie: Ø 10,5)
const AT=k=>S[6]+0.15+k*0.72;
function bubble(x,y,s,col,o=1,sc=1,fg='#05070c'){if(o<=0)return'';const w=s.length*30*0.68+50;return `<g opacity="${o}" transform="translate(${x},${y}) scale(${sc})"><rect x="${-w/2}" y="-40" width="${w}" height="72" rx="22" fill="${col}"/><path d="M-12,30 L0,56 L14,30Z" fill="${col}"/>${txt(0,10,s,34,fg,900)}</g>`}
function street(t,o=1){if(o<=0)return'';let s=`<g opacity="${o}">`;
 // Häuser-Silhouetten
 const H=[[40,560,160],[215,470,140],[370,540,170],[555,455,150],[720,520,160],[895,470,170]];
 H.forEach(([x,y,w],i)=>{s+=`<rect x="${x}" y="${y}" width="${w}" height="${GY-y}" fill="#121a28"/>`;for(let r=0;r<4;r++)for(let c=0;c<3;c++){const on=((i*7+r*3+c)%5)<2;s+=`<rect x="${x+18+c*(w-36)/3}" y="${y+24+r*60}" width="22" height="30" fill="${on?'#3a4660':'#182234'}"/>`;}});
 s+=`<rect x="0" y="${GY}" width="1080" height="14" fill="#2a3444"/><rect x="0" y="${GY+14}" width="1080" height="40" fill="#0d121c"/>`;
 return s+'</g>';}
function walkers(t,o=1,n=5,skipMid=false){if(o<=0)return'';let s=`<g opacity="${o}">`;
 for(let i=0;i<n;i++){const x=((t*55+i*270)%1350)-130;const ph=Math.floor(t*3.3+i)%2;s+=benAt(x,GY,ph?P.walkA:P.walkB,WS,GREYS[i%4],0,skipMid?0.45:1,true);}
 return s+'</g>';}
function clip(x,y,sc,o=1){if(o<=0)return'';return `<g opacity="${o}" transform="translate(${x},${y}) scale(${sc})"><rect x="-34" y="-46" width="68" height="92" rx="8" fill="#cfd6e6"/><rect x="-14" y="-54" width="28" height="14" rx="4" fill="#5c5c5c"/><g stroke="#5c5c5c" stroke-width="5"><line x1="-20" y1="-18" x2="20" y2="-18"/><line x1="-20" y1="2" x2="20" y2="2"/><line x1="-20" y1="22" x2="10" y2="22"/></g></g>`}
function ben(t,x,pose,o=1){return benAt(x,GY,pose,BS,WHITE,0,o,true)+clip(x+62*BS/0.6,GY-200*BS/0.6,1.3,o)}
// ---------- Hook + Optionen (bis S3)
function partHook(t){const o=env(t,-1,S[3]+0.2,0.001,0.35);if(o<=0)return'';let s='';
 if(HV==='B'){s+=`<g transform="translate(540,700) scale(2.2) translate(-540,-820)">`+ben(t,520,Math.floor(t/0.6)%2?P.reach:P.stand)+'</g>'+txt(800,560,'?',220,YEL,900,0.6+0.4*Math.sin(t*4));}
 else if(HV==='C'){const n=Math.min(20,Math.floor(t*8));s+=txt(540,760,String(n),300,n<20?WHITE:RED,900)+txt(540,860,'GEFRAGT',44,'#cfd6e6',900);}
 else {s+=walkers(t,1,5,true)+ben(t,560,Math.floor(t/0.7)%2?P.reach:P.stand);s+=bubble(720,GY-500,'?',YEL,1,1.6+0.1*Math.sin(t*3));}
 const locked=t>=S[1]+1.6;
 s+=optCards(t,OPT,1170,1,{hl:Math.floor(t/0.9)%3});
 if(t>=S[1]){const q=cl((t-S[1]-1.6)/0.3);s+=`<g opacity="${q}" transform="translate(465,1345)">`+tag(0,0,'MERK DIR DEINE ZAHL',WHITE,'#05070c',38)+'</g>';}
 if(t>=S[2]){const q=eb(cl((t-S[2]-0.1)/0.35));s+=`<g transform="translate(465,1460) scale(${q})">`+tag(0,0,'FAST JEDER: ×2 ZU HOCH',RED,WHITE,40)+'</g>';}
 return `<g opacity="${o}">${s}</g>`;}
// ---------- Straße mit Ben (S3..S8)
function partStreet(t){const o=env(t,S[3],S[8]+0.1,0.3,0.35);if(o<=0)return'';let s='';
 const asking=t>=S[6]&&t<S[7];
 s+=walkers(t,asking?0.35:1,5,true);
 const bx=380+ (t<S[3]+1.2? 180*(1-eo((t-S[3])/1.2)):0);
 const pose=t<S[3]+1.2?(Math.floor(t*3.3)%2?P.walkA:P.walkB):P.stand;
 s+=ben(t,bx,pose);
 if(t<S[4])s+=`<g transform="translate(465,1110)">`+tag(0,0,'FELDVERSUCH · COLUMBIA UNIVERSITY, NEW YORK',BLUE,'#05070c',28,cl((t-S[3]-0.6)/0.3))+'</g>';
 // Fragebogen-Zähler
 if(t>=S[4]){const q=eb(cl((t-S[4])/0.4));let yes=0,asked=0;for(let k=0;k<10;k++){if(t>=AT(k)+0.3){asked++;if(ASK[k]==='J')yes++;}}
  s+=`<g transform="translate(465,1100) scale(${q})"><rect x="-390" y="-70" width="780" height="150" rx="24" fill="#0b0f16" stroke="#2a3444" stroke-width="5"/>`+txt(-360,-18,'FRAGEBOGEN',30,'#cfd6e6',900,1,'start');
  for(let i=0;i<5;i++){const f=i<yes;s+=`<rect x="${-360+i*88}" y="5" width="66" height="56" rx="12" fill="${f?GREEN:'#1d2533'}" stroke="${f?GREEN:'#3a4660'}" stroke-width="4"/>`+(f?txt(-327+i*88,46,'✓',38,'#05070c',900):'');}
  s+=txt(230,-6,'GEFRAGT',28,'#cfd6e6',900)+txt(230,58,String(asked),68,asked>0?YEL:WHITE,900)+'</g>';}
 // Schätzung: Gedankenblase + 20 graue Menschen
 if(t>=S[5]){const q=eb(cl((t-S[5])/0.4));if(t<S[6]+0.4)s+=`<g opacity="${env(t,S[5],S[6]+0.4,0.2,0.3)}" transform="translate(${bx+300},${GY-450}) scale(${q})"><ellipse cx="0" cy="0" rx="130" ry="70" fill="#1d2533" stroke="${WHITE}" stroke-width="5"/><circle cx="-90" cy="90" r="16" fill="#1d2533" stroke="${WHITE}" stroke-width="4"/>${txt(0,22,'~20',64,YEL,900)}</g>`;
  for(let i=0;i<20;i++){const c=i%10,r=Math.floor(i/10);const x=130+c*70,y=1250+r*112;const k=i<10?i:-1;let col='#3a4660';let qi=cl((t-S[5]-0.2-i*0.05)/0.2);
   if(k>=0&&t>=AT(k)+0.3)col=ASK[k]==='J'?GREEN:RED;
   const done=t>=S[7];if(done&&i>=10)col='#1d2533';
   s+=`<g opacity="${qi}">`+benAt(x,y+40,P.stand,0.28,col,0,1,true)+'</g>';
   if(done&&i>=10&&i===15){s+=`<g opacity="${cl((t-S[7]-0.3)/0.3)}">`+`<line x1="${115+10*70-40}" y1="1180" x2="${115+70*5-30}" y2="1380" stroke="${RED}" stroke-width="0"/></g>`;}}
  if(t>=S[7]){const q2=cl((t-S[7]-0.4)/0.3);s+=`<g opacity="${q2}"><rect x="${130+10*70-34-700}" y="1215" width="0" height="0" rx="16" fill="#05070c" opacity=".55"/></g>`;}
 }
 // Fragen-Sequenz: Fremde kommen nacheinander
 if(asking){for(let k=0;k<10;k++){const a=AT(k);if(t<a-0.05||t>a+0.72)continue;const u=(t-a)/0.72;const x=u<0.3?1000-380*eo(u/0.3):(u>0.8?620+500*eio((u-0.8)/0.2):620);
   s+=benAt(x,GY,P.stand,WS,GREYS[k%4],0,1,false);if(u>0.35&&u<0.95){const yes=ASK[k]==='J';s+=bubble(x,GY-420,yes?'JA':'NEIN',yes?GREEN:RED,1,eb(cl((u-0.35)/0.15)),yes?'#05070c':WHITE);}}
  s+=bubble(bx+60,GY-480,'KURZ HELFEN?',WHITE,((t-S[6])%0.72)<0.3?1:0,1);}
 return `<g opacity="${o}">${s}</g>`;}
// ---------- Balken 20,5 vs 10,5 (S7..S8)
function bars(t,a,y,items,o){let s='';items.forEach(([lab,v,max,col,num],i)=>{const k=eo(cl((t-a-i*0.5)/0.8));const yy=y+i*150;s+=txt(85,yy-16,lab,30,col,900,1,'start')+`<rect x="85" y="${yy}" width="760" height="70" rx="14" fill="#1d2533"/><rect x="85" y="${yy}" width="${760*v/max*k}" height="70" rx="14" fill="${col}"/>`+txt(85+760*v/max*k-14,yy+50,num,40,'#05070c',900,k>0.3?1:0,'end');});return `<g opacity="${o}">${s}</g>`;}
function partHalf(t){const o=env(t,S[7],S[8]+0.1,0.25,0.3);if(o<=0)return'';
 return `<g opacity="${o}"><rect x="40" y="980" width="860" height="560" fill="#05070c" opacity=".92"/>`+bars(t,S[7]+0.2,1110,[['GESCHÄTZT',20.5,20.5,RED,'20,5'],['GEBRAUCHT',10.5,20.5,GREEN,'10,5']],1)+`<g transform="translate(465,1420) scale(${eb(cl((t-S[7]-1.8)/0.35))})">`+tag(0,0,'NUR DIE HÄLFTE',YEL,'#05070c',44)+'</g></g>';}
// ---------- Handy + Gym (S8..S10)
function icon(kind,x,y,sc){if(kind==='phone')return `<g transform="translate(${x},${y}) scale(${sc})"><rect x="-70" y="-120" width="140" height="240" rx="24" fill="#0b0f16" stroke="${WHITE}" stroke-width="10"/><circle cx="0" cy="95" r="10" fill="${WHITE}"/><rect x="-46" y="-90" width="92" height="160" rx="8" fill="${BLUE}" opacity=".5"/></g>`;
 return `<g transform="translate(${x},${y}) scale(${sc})"><rect x="-130" y="-14" width="260" height="28" rx="10" fill="${WHITE}"/><rect x="-150" y="-70" width="40" height="140" rx="12" fill="${ORANGE}"/><rect x="110" y="-70" width="40" height="140" rx="12" fill="${ORANGE}"/><rect x="-190" y="-45" width="34" height="90" rx="10" fill="${ORANGE}"/><rect x="156" y="-45" width="34" height="90" rx="10" fill="${ORANGE}"/></g>`;}
function rows(t,a,est,need,y,o){let s=`<g opacity="${o}">`;
 s+=txt(85,y-20,'GESCHÄTZT: '+est,34,RED,900,1,'start');for(let i=0;i<est;i++){const q=cl((t-a-i*0.07)/0.2);s+=`<g opacity="${q}">`+benAt(110+i*72,y+120,P.stand,0.3,RED,0,1,true)+'</g>';}
 const b=a+1.8;s+=txt(85,y+190,'GEBRAUCHT: '+need,34,GREEN,900,cl((t-b)/0.3),'start');for(let i=0;i<need;i++){const q=eb(cl((t-b-i*0.12)/0.3));s+=`<g opacity="${cl(q)}">`+benAt(110+i*72,y+330,P.cheer,0.3,GREEN,0,1,true)+'</g>';}
 return s+'</g>';}
function partTwo(t){let s='';
 const o1=env(t,S[8],S[9]+0.05,0.25,0.25);if(o1>0){s+=`<g opacity="${o1}">`+icon('phone',540,680,1.25)+`<g transform="translate(540,880)">`+tag(0,0,'3 × „JA, LEIH ICH DIR“',BLUE,'#05070c',34)+'</g>'+rows(t,S[8]+0.5,10,6,1060,1)+'</g>';}
 const o2=env(t,S[9],S[10]+0.05,0.25,0.25);if(o2>0){s+=`<g opacity="${o2}">`+icon('gym',540,690,1.3)+`<g transform="translate(540,880)">`+tag(0,0,'1 × „ICH BRING DICH HIN“',ORANGE,'#05070c',34)+'</g>'+rows(t,S[9]+0.5,7,2,1060,1)+'</g>';}
 return s;}
// ---------- NEIN-Wolke schrumpft (S10..PAY)
function partFear(t){const o=env(t,S[10],PAY+0.05,0.25,0.25);if(o<=0)return'';let s='';
 const k=eio(cl((t-S[10]-1.6)/1.8));const r=230-120*k;
 s+=benAt(260,1400,Object.assign({},P.stand,{headTilt:-35,torso:-6}),0.9,WHITE,0,1,true);
 s+=`<g transform="translate(620,${720+60*k})"><circle r="${r}" fill="${RED}" opacity=".9"/>${txt(0,r*0.18,'NEIN',r*0.52,WHITE,900)}</g>`;
 s+=txt(620,1010+60*k-110*k,k<0.5?'IN DEINEM KOPF':'IN ECHT',34,'#cfd6e6',900);
 s+=txt(465,1480,'Die Hälfte der Neins gab es nur in der Vorstellung.',28,'#cfd6e6',800,cl((t-S[10]-3)/0.3));
 return `<g opacity="${o}">${s}</g>`;}
// ---------- Kipppunkt (PAY..SAVE)
function payoff(t){const o=env(t,PAY,SAVE,0.001,0.25);if(o<=0)return'';let s='';
 s+=street(t,1);const u=cl((t-PAY)/1.2);
 s+=ben(t,330+120*eo(u),u<1?(Math.floor(t*3.3)%2?P.walkA:P.walkB):P.reach);
 s+=benAt(720,GY,t>PAY+2?P.cheer:P.stand,WS,'#9aa6b8',0,1,false);
 s+=bubble(470,GY-490,'KANNST DU MIR HELFEN?',WHITE,cl((t-PAY-1.0)/0.25));
 if(t>PAY+2)s+=bubble(760,GY-440,'KLAR!',GREEN,1,eb(cl((t-PAY-2)/0.3)));
 for(let i=0;i<6;i++){const a=PAY+2.2+i*0.25;if(t<a)continue;const q=cl((t-a)/1.6);s+=txt(560+((i*67)%240)-120,GY-420-q*260,'♥',50,GREEN,900,1-q);}
 if(t<S[12])s+=`<g transform="translate(465,1180) scale(${eb(cl((t-PAY-0.6)/0.4))})">`+tag(0,0,'HEUTE: 1 PERSON FRAGEN',GREEN,'#05070c',46)+'</g>';
 if(t>=S[12]){s+=optCards(t,OPT,1180,cl((t-S[12])/0.3),{win:1});}
 if(t>=S[13]){const q=cl((t-S[13])/0.3);s+=`<g opacity="${q}" transform="translate(465,1420)">`+tag(0,0,'SCHICK DAS JEMANDEM, DER SICH NIE TRAUT',WHITE,'#05070c',30)+'</g>';}
 return `<g opacity="${o}">${s}</g>`;}
window.SFXC=()=>{const c=[[0,'whoosh'],[0.05,'boom'],[0.1,'pop']];for(let k=1;k<4;k++)c.push([k*0.9,'tick']);
 c.push([S[1],'whoosh'],[S[1]+1.6,'ding'],[S[2],'whoosh'],[S[2]+0.1,'buzz']);
 c.push([S[3],'whoosh'],[S[3]+0.6,'pop'],[S[4],'whoosh'],[S[4]+0.1,'pop'],[S[5],'whoosh'],[S[5]+0.1,'pop']);for(let i=0;i<20;i+=2)c.push([S[5]+0.2+i*0.05,'tick']);
 for(let k=0;k<10;k++){c.push([AT(k),'whoosh']);c.push([AT(k)+0.3,ASK[k]==='J'?'ding':'buzz']);}
 c.push([S[7],'boom'],[S[7]+0.2,'whoosh'],[S[7]+0.7,'pop'],[S[7]+1.8,'ding']);
 c.push([S[8],'whoosh'],[S[8]+0.5,'tick'],[S[8]+2.3,'ding'],[S[9],'whoosh'],[S[9]+0.5,'tick'],[S[9]+2.3,'ding']);
 c.push([S[10],'whoosh'],[S[10]+1.6,'buzz'],[S[10]+3,'pop']);
 c.push([PAY,'boom'],[PAY+0.05,'ding'],[PAY+1.0,'pop'],[PAY+2,'ding']);
 c.push([S[12],'whoosh'],[S[12]+0.3,'pop'],[S[13],'whoosh'],[SAVE,'whoosh'],[SAVE+0.2,'pop'],[SAVE+0.42,'pop'],[SAVE+0.64,'pop'],[SAVE+0.8,'ding']);
 return c;};
window.render=function(t){let s=bg(t<0.6?0.5*(1-t/0.6)+0.15:(t>S[10]&&t<PAY?0.3:0),t>=PAY&&t<SAVE?0.6:0);
 s+=head();
 const so=t<S[8]+0.1?1:0; if(so) s+=street(t,env(t,-1,S[8]+0.1,0.001,0.35));
 s+=partHook(t)+partStreet(t)+partHalf(t)+partTwo(t)+partFear(t)+payoff(t);
 s+=LH(t,-1,S[1],300,'WIE VIELE FREMDE MUSST DU FRAGEN,',56,WHITE)+LH(t,-1,S[2],378,'BIS 5 JA SAGEN?',62,YEL);
 s+=L(t,S[1],S[2],300,'5, 10 ODER 20?',90,WHITE);
 s+=L(t,S[2],S[3],300,'FAST JEDER SCHÄTZT',76,WHITE)+L(t,S[2]+0.3,S[3],378,'DOPPELT SO HOCH.',62,RED);
 s+=L(t,S[3],S[4],300,'DAS EXPERIMENT:',86,WHITE)+L(t,S[3]+0.8,S[4],378,'ECHTE FREMDE. ECHTE STRASSE.',50,YEL);
 s+=L(t,S[4],S[5],300,'DIE AUFGABE:',90,WHITE)+L(t,S[4]+0.6,S[5],378,'5 LEUTE FÜLLEN EINEN BOGEN AUS.',48,YEL);
 s+=L(t,S[5],S[6],300,'VORHER GESCHÄTZT:',80,WHITE)+L(t,S[5]+0.6,S[6],378,'„ICH MUSS ~20 LEUTE FRAGEN.“',50,RED);
 s+=L(t,S[6],S[7],300,'DANN: LOSFRAGEN.',86,WHITE)+L(t,S[6]+0.5,S[7],378,'NEIN. JA. NEIN. JA. JA …',54,YEL);
 s+=L(t,S[7],S[8],300,'10,5 STATT 20,5.',96,GREEN)+L(t,S[7]+0.8,S[8],378,'DU BRAUCHST NUR DIE HÄLFTE.',52,WHITE);
 s+=L(t,S[8],S[9],300,'HANDY LEIHEN?',90,WHITE)+L(t,S[8]+0.6,S[9],378,'GESCHÄTZT 10 · GEBRAUCHT 6',52,YEL);
 s+=L(t,S[9],S[10],300,'ZUM GYM BEGLEITEN?',80,WHITE)+L(t,S[9]+0.6,S[10],378,'GESCHÄTZT 7 · GEBRAUCHT 2',52,YEL);
 s+=L(t,S[10],PAY,300,'WIR RECHNEN MIT DEM NEIN.',66,WHITE)+L(t,S[10]+1.6,PAY,378,'DABEI IST ES VIEL SELTENER.',52,RED);
 if(t>=PAY&&t<S[12]){const o=env(t,PAY,S[12],0.001,0.25),sc=1.5-0.5*eb((t-PAY)/0.35);s+=`<g opacity="${o}" transform="translate(540,300) scale(${sc})">${txt(0,0,'DIE MEISTEN HELFEN GERN.',56,GREEN,900,1,'middle',1)}</g>`+L(t,PAY+0.9,S[12],378,'DU MUSST NUR FRAGEN.',62,WHITE);}
 s+=L(t,S[12],SAVE,300,'WIE VIELE HATTEST DU GETIPPT?',58,WHITE)+L(t,S[12]+0.5,SAVE,378,'SCHREIB’S IN DIE KOMMENTARE.',50,YEL);
 s+=cpill(t,20.6,25.4,'WOBEI TRAUST DU DICH NICHT ZU FRAGEN?');
 if(t<S[8])s+=SRC(t,S[3],S[8],'Flynn & Lake (2008), J. Pers. Soc. Psychol. 95(1), 128–143','Studie 1: N = 42 · geschätzt 20,5 vs. gebraucht 10,5 Personen');
 else s+=SRC(t,S[8],PAY,'Flynn & Lake (2008), Studie 2: Handy leihen 10,1 → 6,2 Personen','zum Gym begleiten 7,2 → 2,3 Personen · Figuren gerundet');
 s+=saveCard(t,SAVE,'TRAU DICH ZU FRAGEN:',['WAS BRAUCHST DU GERADE?','WER KÖNNTE HELFEN?','HEUTE NOCH FRAGEN']);
 s+=brand();
 document.getElementById('stage').innerHTML=s;
 const fl=document.getElementById('flash');const g=env(t,PAY,PAY+0.7,0.001,0.6);
 fl.style.background=GREEN;fl.style.opacity=0.38*g;
};
render(0);
</script></body></html>
